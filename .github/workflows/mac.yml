name: Build iOS App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.2'  # Spécifiez une version Flutter compatible

    - name: Upgrade Flutter
      run: flutter upgrade

    - name: Install Flutter dependencies
      run: flutter pub get

    - name: Build iOS
      run: flutter build ipa --release

    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: MyApp.ipa
        path: build/ios/ipa
