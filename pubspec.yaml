name: new_app
description: "A new Flutter project."

publish_to: "none" # Empêche la publication accidentelle sur pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.3 # Version minimale requise du SDK Dart

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8 # Icônes de style iOS
  firebase_core: ^3.6.0 # Initialisation de Firebase pour Flutter
  firebase_auth: ^5.3.1 # Authentification Firebase
  cloud_firestore: ^5.4.4 # Base de données NoSQL Firebase
  firebase_storage: ^12.3.4 # Stockage Firebase pour les fichiers
  firebase_messaging: ^15.1.3 # Notifications push Firebase
  cloud_functions: ^5.1.0 # Cloud Functions Firebase (envoi notifications FCM)
  http: ^1.2.2 # Client HTTP pour les requêtes API
  page_transition: ^2.1.0 # Effets de transition pour les pages
  uuid: ^4.5.0 # Génération d'identifiants uniques
  shared_preferences: ^2.3.2 # Stockage local clé-valeur pour les préférences utilisateur
  image_picker: ^1.1.2 # Sélection d'images depuis la galerie ou l'appareil photo
  intl: ^0.20.2 # Internationalisation et localisation des dates, nombres, etc.
  url_launcher: ^6.3.0 # Ouvrir des URL dans le navigateur ou d'autres applications
  file_picker: ^8.1.2 # Sélection de fichiers depuis le stockage local
  flutter_local_notifications: ^17.2.3 # Notifications locales personnalisées
  photo_view: ^0.15.0 # Affichage zoomable et panoramique d'images
  flutter_linkify: ^6.0.0 # Conversion de liens en liens cliquables dans le texte
  whatsapp_text_formatter: ^1.1.0 # Rendu du formatage WhatsApp (*gras*, _italique_, ~barré~)
  path_provider: ^2.0.2 # Accès aux répertoires système (documents, cache, etc.)
  cached_network_image: ^3.4.1 # Chargement d'images avec mise en cache pour réduire les appels réseau
  image: ^4.1.7 # Traitement d'images (compression) utilisé dans user_service.dart

dev_dependencies:
  flutter_test:
    sdk: flutter # Outils de test pour Flutter
  flutter_launcher_icons: ^0.14.1 # Génération d'icônes pour iOS et Android

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_app.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/connection-inscription/
    - assets/images/Navbar-Icons/
    - assets/images/xoss/
    - assets/images/Competition/
    - assets/images/homepage/
    - assets/images/polytech-Info/
    - assets/images/top-left-menu/
    - assets/images/equipe/
    - assets/images/objets-perdus/
    - assets/images/football/
    - assets/images/basketball/
    - assets/images/volleyball/
    - assets/images/jeux-desprit/
    - assets/images/jeux/
    - assets/images/Competition/

  fonts:
    - family: LilyScriptOne
      fonts:
        - asset: assets/fonts/LilyScriptOne-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Bold.ttf
    - family: InterLight
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-ExtraLight.ttf
    - family: InterMedium
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-Light.ttf
    - family: InterRegular
      fonts:
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
